<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Data (Express + Flask)</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background: #00684A; color: white; border: none; cursor: pointer; }
        .error { color: #b91c1c; background: #fee2e2; padding: 10px; border-radius: 4px; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>
    <h2>User Registration</h2>

    <div id="error-box" class="error"></div>

    <form id="userForm">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
        </div>
        <button type="submit">Submit</button>
    </form>

    <script>
        const form = document.getElementById('userForm');
        const errorBox = document.getElementById('error-box');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;

            try {
                const response = await fetch('http://127.0.0.1:5000/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email })
                });

                const result = await response.json();

                if (response.ok) {
                    // Redirect to Express success page
                    window.location.href = '/success';
                } else {
                    // Display Flask validation/database error on the same page
                    errorBox.textContent = result.error || 'Submission failed.';
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                errorBox.textContent = 'Could not connect to the Flask backend.';
                errorBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>

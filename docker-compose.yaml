
services:
  backend:
    build: ./backend
    container_name: flask-backend
    hostname: flask-backend
    expose:
      - "5000"
    env_file:
      - ./backend/.env
    networks:
      - docker-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: express-frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://flask-backend:5000
    depends_on:
      - backend
    networks:
      - docker-network
    restart: unless-stopped

networks:
  docker-network:
    driver: bridge

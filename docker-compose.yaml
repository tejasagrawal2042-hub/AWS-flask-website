services:
  backend:
    build: ./backend
    container_name: flask-backend
    hostname: flask-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    networks:
      - docker-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: express-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    networks:
      - docker-network
    restart: unless-stopped

networks:
  docker-network:
    driver: bridge
